name: EA Bring GitHub Secrets staging preflight (no provider access)

on:
  pull_request:
    paths:
      - ".github/workflows/ea-bring-github-secrets-staging.yml"
      - "integrations/bring/github_secrets_staging_preflight.py"
      - "integrations/bring/tests/test_github_secrets_staging_preflight.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ea-bring-github-secrets-staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-tests:
    name: Test fail-closed secret contract without accessing secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout synthetic test code (without persisted credentials)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run non-networking unit tests
        run: python3 -m unittest discover -s integrations/bring/tests -p "test_github_secrets_staging_preflight.py" -v

  protected-secret-preflight:
    name: Check configured Bring environment secrets without provider calls
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: offline-tests
    runs-on: ubuntu-latest
    timeout-minutes: 4
    # Existing environment used by the Bring pilot. Operator must verify its
    # required-reviewer and protected-main environment rules before dispatch.
    environment: bring-pilot
    permissions:
      contents: read
    steps:
      - name: Checkout only protected main source without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify only secret presence, formatting and disabled live switches
        env:
          BRING_API_UID: ${{ secrets.BRING_API_UID }}
          BRING_API_KEY: ${{ secrets.BRING_API_KEY }}
          BRING_CLIENT_URL: ${{ vars.BRING_CLIENT_URL }}
          EA_STAGING_CREDENTIAL_SOURCE: github_actions_environment
          EA_STAGING_DATA_SCOPE: synthetic_only
          EA_BRING_PROVIDER_CALLS_ENABLED: "false"
          EA_BRING_PRODUCTION_SYNC_ENABLED: "false"
          EA_LIVE_PROVIDER_SYNC_ENABLED: "false"
          EA_LEVEL_2B_ENABLED: "false"
        shell: bash
        run: |
          set -euo pipefail
          python3 integrations/bring/github_secrets_staging_preflight.py
