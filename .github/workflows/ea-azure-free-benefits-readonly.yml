name: EA Azure free-account benefits — read-only evidence

on:
  pull_request:
    paths:
      - .github/workflows/ea-azure-free-benefits-readonly.yml
      - level-2/backend/deployment/pricing/azure_free_account_probe.py
      - level-2/backend/deployment/pricing/test_azure_free_account_probe.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-probe-offline:
    name: validate-free-benefit-fail-closed-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run offline classification and privacy tests
        run: python3 -m unittest discover -s level-2/backend/deployment/pricing -p 'test_azure_free_account_probe.py' -v

  read-account-benefits:
    name: inspect-free-account-metadata-readonly
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: ea-staging-preflight
    permissions:
      id-token: write
      contents: read
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify Azure IDs are present (no values printed)
        shell: bash
        run: |
          set -euo pipefail
          for variable in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [[ ! "${!variable:-}" =~ ^[[:xdigit:]]{8}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{12}$ ]]; then
              echo "::error::Missing or invalid protected Azure variable ${variable}"
              exit 1
            fi
          done
      - name: Authenticate to Azure (immutable GitHub OIDC / read-only Reader)
        uses: Azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: false
      - name: Confirm approved subscription and tenant before billing reads
        shell: bash
        run: |
          set -euo pipefail
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"
          [[ "$(az account show --query id -o tsv)" == "$AZURE_SUBSCRIPTION_ID" ]] || exit 1
          [[ "$(az account show --query tenantId -o tsv)" == "$AZURE_TENANT_ID" ]] || exit 1
      - name: Read and sanitize billing/free-service metadata
        shell: bash
        run: python3 level-2/backend/deployment/pricing/azure_free_account_probe.py
