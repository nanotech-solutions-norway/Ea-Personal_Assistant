name: EA Azure ACA subscription price sheet (read only)

on:
  pull_request:
    paths:
      - ".github/workflows/ea-azure-aca-subscription-price-readonly.yml"
      - "level-2/backend/deployment/pricing/azure_aca_subscription_price_readonly.py"
      - "level-2/backend/deployment/pricing/test_azure_aca_subscription_price_readonly.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ea-aca-subscription-prices-readonly
  cancel-in-progress: false

jobs:
  offline-security-tests:
    name: validate-aca-price-sheet-reader-privacy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run entirely synthetic tests (no Azure tokens)
        run: python3 -m unittest discover -s level-2/backend/deployment/pricing -p 'test_azure_aca_subscription_price_readonly.py' -v

  protected-subscription-pricesheet-read:
    name: attempt-account-eur-aca-pricesheet-readonly
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: ea-staging-preflight
    permissions:
      id-token: write
      contents: read
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate protected identity configuration without logging values
        shell: bash
        run: |
          set -euo pipefail
          for variable in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [[ ! "${!variable:-}" =~ ^[[:xdigit:]]{8}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{12}$ ]]; then
              echo "::error::Missing or invalid protected ${variable}"
              exit 1
            fi
          done
      - name: Authenticate as existing Reader (OIDC, no new privileges)
        uses: Azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: false
      - name: Match approved tenant and subscription (no values published)
        shell: bash
        run: |
          set -euo pipefail
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"
          [[ "$(az account show --query id -o tsv)" == "$AZURE_SUBSCRIPTION_ID" ]] || exit 1
          [[ "$(az account show --query tenantId -o tsv)" == "$AZURE_TENANT_ID" ]] || exit 1
      - name: Read selected ACA price-sheet rates only (Azure GET; no raw records)
        shell: bash
        run: python3 level-2/backend/deployment/pricing/azure_aca_subscription_price_readonly.py
