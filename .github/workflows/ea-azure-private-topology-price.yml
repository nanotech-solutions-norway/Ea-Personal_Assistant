name: EA Azure private topology and foundation EUR pricing (no deployment)

on:
  pull_request:
    paths:
      - ".github/workflows/ea-azure-private-topology-price.yml"
      - "level-2/backend/deployment/pricing/scenario_envelope_gate.py"
      - "level-2/backend/deployment/pricing/test_scenario_envelope_gate.py"
      - "level-2/backend/deployment/pricing/EA_48H_SYNTHETIC_USAGE_ENVELOPE_PROPOSED_20261015.json"
      - "level-2/backend/deployment/pricing/EA_TIMEBOX_48H_QUOTE_TEMPLATE_20261015.json"
      - "level-2/backend/deployment/pricing/azure_foundation_meter_probe.py"
      - "level-2/backend/deployment/pricing/reconcile_public_retail.py"
      - "level-2/backend/deployment/pricing/aca_compute_catalog_probe.py"
      - "level-2/backend/deployment/pricing/private_billing_evidence.py"
      - "level-2/backend/deployment/pricing/teardown_liability_gate.py"
      - "level-2/backend/deployment/pricing/all_in_meter_coverage.py"
      - "level-2/backend/deployment/pricing/test_all_in_meter_coverage.py"
      - "level-2/backend/deployment/pricing/EA_ALL_IN_BILLABLE_METER_MATRIX_PROPOSED_20261015.json"
      - "level-2/backend/deployment/pricing/test_teardown_liability_gate.py"
      - "level-2/backend/deployment/pricing/EA_48H_TEARDOWN_OBLIGATIONS_PROPOSED_20261015.json"
      - "level-2/backend/deployment/pricing/test_private_billing_evidence.py"
      - "level-2/backend/deployment/pricing/test_aca_compute_catalog_probe.py"
      - "level-2/backend/deployment/pricing/test_reconcile_public_retail.py"
      - "level-2/backend/deployment/pricing/validate_private_topology.py"
      - "level-2/backend/deployment/pricing/test_validate_private_topology.py"
      - "level-2/backend/deployment/pricing/EA_48H_PRIVATE_TOPOLOGY_PROPOSED_20261015.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  topology-lint:
    name: check-private-topology-no-cloud-auth
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate independent synthetic negative security tests
        run: python3 -m unittest discover -s level-2/backend/deployment/pricing -p 'test_validate_private_topology.py' -v
      - name: Adversarial review of nondeployable synthetic usage bounds
        run: python3 -m unittest discover -s level-2/backend/deployment/pricing -p 'test_scenario_envelope_gate.py' -v
      - name: Unit-test PRIVATE billing parser using synthetic fixtures ONLY
        run: python3 -m unittest discover -s level-2/backend/deployment/pricing -p 'test_private_billing_evidence.py' -v
      - name: Validate static managed-infrastructure teardown and delayed-billing sensitivity
        run: |
          python3 -m unittest discover -s level-2/backend/deployment/pricing -p 'test_teardown_liability_gate.py' -v
          python3 level-2/backend/deployment/pricing/teardown_liability_gate.py level-2/backend/deployment/pricing/EA_48H_TEARDOWN_OBLIGATIONS_PROPOSED_20261015.json level-2/backend/deployment/pricing/EA_TIMEBOX_48H_QUOTE_TEMPLATE_20261015.json
      - name: Verify all-in sub-meter evidence coverage remains fail-closed
        run: |
          python3 -m unittest discover -s level-2/backend/deployment/pricing -p 'test_all_in_meter_coverage.py' -v
          python3 level-2/backend/deployment/pricing/all_in_meter_coverage.py level-2/backend/deployment/pricing/EA_ALL_IN_BILLABLE_METER_MATRIX_PROPOSED_20261015.json level-2/backend/deployment/pricing/EA_TIMEBOX_48H_QUOTE_TEMPLATE_20261015.json
      - name: Check public retail partial estimate (must remain deployment BLOCKED)
        run: |
          python3 level-2/backend/deployment/pricing/scenario_envelope_gate.py level-2/backend/deployment/pricing/EA_48H_SYNTHETIC_USAGE_ENVELOPE_PROPOSED_20261015.json level-2/backend/deployment/pricing/EA_TIMEBOX_48H_QUOTE_TEMPLATE_20261015.json
      - name: Verify proposed 48-hour topology only (never deploy)
        run: |
          python3 level-2/backend/deployment/pricing/validate_private_topology.py level-2/backend/deployment/pricing/EA_48H_PRIVATE_TOPOLOGY_PROPOSED_20261015.json
  retail-foundation:
    name: inspect-public-ip-load-balancer-eur-rates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Query Microsoft public IP, standard load balancer, and environment retail meters
        run: python3 level-2/backend/deployment/pricing/azure_foundation_meter_probe.py
      - name: Verify fail-closed price meter reconciliation and zero-rate ambiguity
        run: |
          python3 -m unittest discover -s level-2/backend/deployment/pricing -p 'test_reconcile_public_retail.py' -v
          python3 level-2/backend/deployment/pricing/reconcile_public_retail.py ea_azure_foundation_eur_catalog_20261015.json ea_azure_public_meter_reconciliation_20261015.json
      - name: Inspect all West Europe ACA active compute price candidates (no subscription API)
        run: |
          python3 -m unittest discover -s level-2/backend/deployment/pricing -p 'test_aca_compute_catalog_probe.py' -v
          python3 level-2/backend/deployment/pricing/aca_compute_catalog_probe.py
      - name: Preserve public catalog candidate evidence (not an Azure bill)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ea-foundation-eur-public-retail-catalog
          path: |
            ea_azure_foundation_eur_catalog_20261015.json
            ea_azure_public_meter_reconciliation_20261015.json
            ea_aca_compute_meter_candidates_20261015.json
          retention-days: 30
